kind = "mobile"
previewPath = "/"
title = "Regime — Premium Fitness App"
version = "1.0.0"
id = "artifacts/fitai"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
name = "expo"
paths = [ "/" ]
localPort = 24172

[services.development]
run = "pnpm --filter @workspace/fitai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fitai", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/fitai", "run", "serve" ]

[services.env]
PORT = "24172"
BASE_PATH = "/"
